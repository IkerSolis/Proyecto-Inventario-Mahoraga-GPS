<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventarios Mahoraga</title>
  <!-- Fuente Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Estilos con Design Tokens -->
  <link rel="stylesheet" href="css/nuevo_producto.css">
</head>
<body>
  <div class="np-layout">
    <!-- ================= SIDEBAR (IZQUIERDA) ================= -->
    <aside class="np-sidebar">
      <div class="np-sidebar-top">
        <!-- Logo y Marca -->
        <div class="np-brand">
          <div class="np-brand-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="3 3">
              <rect x="3" y="3" width="18" height="18" rx="4" />
            </svg>
          </div>
          <div class="np-brand-text">
            <span class="np-brand-name">GestiónInv</span>
            <span class="np-brand-sub">Control Profesional</span>
          </div>
        </div>

        <!-- Menú de Navegación -->
        <nav class="np-nav">
          <a href="#inicio" class="np-nav-item">
            <span class="np-nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
              </svg>
            </span>
            <span>Inicio</span>
          </a>

          <a href="#inventario" class="np-nav-item np-nav-item--active">
            <span class="np-nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="21 8 21 21 3 21 3 8"/>
                <rect x="1" y="3" width="22" height="5"/>
                <line x1="10" y1="12" x2="14" y2="12"/>
              </svg>
            </span>
            <span>Inventario</span>
          </a>

          <a href="#servicios" class="np-nav-item">
            <span class="np-nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
                <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
              </svg>
            </span>
            <span>Servicios</span>
          </a>

          <a href="#usuarios" class="np-nav-item">
            <span class="np-nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
              </svg>
            </span>
            <span>Usuarios</span>
          </a>

          <a href="#personalizacion" class="np-nav-item">
            <span class="np-nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
              </svg>
            </span>
            <span>Personalización</span>
          </a>
        </nav>
      </div>

      <!-- Footer del Sidebar con Carlos Ruiz -->
      <div class="np-sidebar-footer">
        <div class="np-user-card">
          <img
            src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100&h=100&fit=crop&crop=faces&q=80"
            alt="Carlos Ruiz"
            class="np-user-avatar"
            onerror="this.style.display='none'"
          >
          <div class="np-user-info">
            <span class="np-user-name">Carlos Ruiz</span>
            <span class="np-user-role">Administrador</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- ================= CONTENEDOR PRINCIPAL ================= -->
    <div class="np-main">
      <!-- Header Superior -->
      <header class="np-header">
        <div class="np-breadcrumb">
          <span>Inventario</span>
          <span>/</span>
          <span class="np-breadcrumb-current">Nuevo producto</span>
        </div>

        <div class="np-header-right">
          <!-- Buscador -->
          <div class="np-search-box">
            <span class="np-search-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
              </svg>
            </span>
            <input
              type="search"
              placeholder="Buscar productos..."
              class="np-search-input"
            >
          </div>

          <!-- Campana de Notificaciones -->
          <button type="button" class="np-icon-btn" aria-label="Notificaciones">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
            </svg>
          </button>

          <!-- Estado del Negocio -->
          <div class="np-business-badge">
            <span class="np-business-name">Comercial del Valle</span>
            <span class="np-business-status">
              <span class="np-status-dot"></span>
              Sincronizado
            </span>
          </div>
        </div>
      </header>

      <!-- Área de Contenido Principal -->
      <main class="np-content">
        <!-- Encabezado con Botón Flecha -->
        <div class="np-page-header">
          <button type="button" class="np-back-btn" aria-label="Atrás">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="19" y1="12" x2="5" y2="12" />
              <polyline points="12 19 5 12 12 5" />
            </svg>
          </button>

          <div>
            <h1 class="np-page-title">Nuevo Producto</h1>
            <p class="np-page-subtitle">
              Completa la información detallada para registrar el nuevo artículo en el catálogo.
            </p>
          </div>
        </div>

        <!-- Tarjeta Card Formulario -->
        <div class="np-card">
          <form class="np-form" onsubmit="event.preventDefault()">
            <div class="np-form-grid">
              <!-- ================= COLUMNA IZQUIERDA ================= -->
              <div class="np-col">
                <div class="np-field">
                  <label for="nombre" class="np-label">Nombre del producto</label>
                  <input
                    id="nombre"
                    type="text"
                    class="np-input"
                    placeholder="Ej. Taladro Percutor Inalámbrico 20V"
                  >
                </div>

                <div class="np-field">
                  <label for="descripcion" class="np-label">Descripción</label>
                  <textarea
                    id="descripcion"
                    rows="5"
                    class="np-textarea"
                    placeholder="Describe brevemente las características físicas, marca o especificaciones del producto..."
                  ></textarea>
                </div>

                <div class="np-row-2">
                  <div class="np-field">
                    <label for="categoria" class="np-label">Categoría</label>
                    <input
                      id="categoria"
                      type="text"
                      class="np-input"
                      value="Ferretería y Herramientas"
                    >
                  </div>
                  <div class="np-field">
                    <label for="estadoInicial" class="np-label">Estado inicial</label>
                    <input
                      id="estadoInicial"
                      type="text"
                      class="np-input"
                      value="Disponible"
                    >
                  </div>
                </div>
              </div>

              <!-- ================= COLUMNA DERECHA ================= -->
              <div class="np-col">
                <div class="np-row-2">
                  <div class="np-field">
                    <label for="precioVenta" class="np-label">Precio de venta ($)</label>
                    <input
                      id="precioVenta"
                      type="text"
                      class="np-input"
                      placeholder="0.00"
                    >
                  </div>
                  <div class="np-field">
                    <label for="cantidadDisponible" class="np-label">Cantidad disponible</label>
                    <input
                      id="cantidadDisponible"
                      type="text"
                      class="np-input"
                      placeholder="0"
                    >
                  </div>
                </div>

                <div class="np-row-2">
                  <div class="np-field">
                    <label for="stockMinimo" class="np-label">Stock mínimo</label>
                    <input
                      id="stockMinimo"
                      type="text"
                      class="np-input"
                      placeholder="Ej. 10"
                    >
                  </div>
                  <div class="np-field">
                    <label for="estado" class="np-label">Estado</label>
                    <input
                      id="estado"
                      type="text"
                      class="np-input"
                      readonly
                      value="Disponible"
                    >
                  </div>
                </div>

                <!-- Imagen del producto (Drag & Drop) -->
                <div class="np-field">
                  <label class="np-label">Imagen del producto</label>
                  <label class="np-dropzone">
                    <input
                      type="file"
                      accept="image/png, image/jpeg, image/jpg"
                      class="np-file-input"
                      onchange="if(this.files && this.files[0]) { document.getElementById('file-prompt').innerText = this.files[0].name; }"
                    >
                    <div class="np-dropzone-icon">
                      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                        <circle cx="8.5" cy="8.5" r="1.5"/>
                        <polyline points="21 15 16 10 5 21"/>
                      </svg>
                    </div>
                    <p id="file-prompt" class="np-dropzone-prompt">Haz clic para subir o arrastra la foto</p>
                    <p class="np-dropzone-hint">Formatos recomendados: PNG, JPG (Max. 5MB)</p>
                  </label>
                </div>
              </div>
            </div>

            <!-- Botones Cancelar y Guardar -->
            <div class="np-actions">
              <button type="button" class="np-btn np-btn-cancelar">
                Cancelar
              </button>
              <button type="submit" class="np-btn np-btn-guardar">
                Guardar
              </button>
            </div>
          </form>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
